name: MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 src/ tests/

  # ─────────────────────────────────────────────
  # Job 2: Test
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: reports/junit.xml
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Train
  # ─────────────────────────────────────────────
  train:
    name: Model Training
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train models
        run: python src/ci_train.py

      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models-${{ github.sha }}
          path: models/
          retention-days: 30

      - name: Upload MLflow run data
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-${{ github.sha }}
          path: mlruns/
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 4: Build & Deploy to IBM Code Engine
  # ─────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Code Engine
    runs-on: ubuntu-latest
    needs: [train]
    # Only deploy on direct pushes to main, not on pull requests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IBM Cloud CLI and plugins
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install container-registry -f
          ibmcloud plugin install code-engine -f

      - name: Login to IBM Cloud
        run: ibmcloud login --apikey ${{ secrets.IBMCLOUD_API_KEY }} -r us-south --quiet

      - name: Login to IBM Container Registry
        run: ibmcloud cr login

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 -t icr.io/${{ secrets.ICR_NAMESPACE }}/heart-disease-api:${{ github.sha }} .
          docker tag icr.io/${{ secrets.ICR_NAMESPACE }}/heart-disease-api:${{ github.sha }} \
                     icr.io/${{ secrets.ICR_NAMESPACE }}/heart-disease-api:latest
          docker push icr.io/${{ secrets.ICR_NAMESPACE }}/heart-disease-api:${{ github.sha }}
          docker push icr.io/${{ secrets.ICR_NAMESPACE }}/heart-disease-api:latest

      - name: Deploy to Code Engine
        run: |
          ibmcloud ce project select --name mlops-assignment
          ibmcloud ce application update \
            --name heart-disease-api \
            --image icr.io/${{ secrets.ICR_NAMESPACE }}/heart-disease-api:${{ github.sha }}
