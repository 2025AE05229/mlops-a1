apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  namespace: heart-disease
  labels:
    app: heart-disease-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-disease-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: heart-disease-api
    spec:
      containers:
        - name: api
          # Image is built locally and loaded into kind (see deployment/README.md).
          # A non-"latest" tag + IfNotPresent stops Kubernetes from trying to pull from a registry.
          image: localhost/heart-disease-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: heart-disease-api-auth
                  key: API_USERNAME
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heart-disease-api-auth
                  key: API_PASSWORD
            # MODEL_PATH intentionally omitted: the app resolves the champion
            # from models/champion.txt baked into the image.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /health is unauthenticated; /predict and /metrics require Basic auth.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
